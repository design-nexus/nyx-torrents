[package]
name = "nyx-torrents"
version = "0.1.0"
description = "A BitTorrent client for Omarchy, built on libtorrent"
license = "MIT"
repository = "https://github.com/design-nexus/nyx-torrents"
authors = ["Ken Smith"]
edition = "2024"

[[bin]]
name = "nyx-torrents"
path = "src/main.rs"

[dependencies]
nyx-core = { git = "https://github.com/design-nexus/nyx-core.git", rev = "4f05fb8fc92ec211f4e0f0b722fdf29a083c9e89" }
nyx-ui = { git = "https://github.com/design-nexus/nyx-design.git", rev = "cf393978364ca7b2a309a88a8d1651bf9d338916" }
nyx-theme = { git = "https://github.com/design-nexus/nyx-design.git", rev = "cf393978364ca7b2a309a88a8d1651bf9d338916" }
anyhow = "1.0.104"
async-channel = "2"
cxx = "1"
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"

[build-dependencies]
cxx-build = "1"
pkg-config = "0.3"
